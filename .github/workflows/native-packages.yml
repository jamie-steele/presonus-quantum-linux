name: Quantum native packages

on:
  pull_request:
  push:
    branches: [dev, staging]
    paths:
      - 'alsa/**'
      - 'packaging/**'
      - 'scripts/release/**'
      - 'scripts/maintenance/**'
      - 'tests/**'
      - 'driver/upstream.lock'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published RFC tag to package (also supports the first tar-only release)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quantum-native-${{ github.event_name == 'pull_request' && github.ref || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || contains(fromJSON('["dev","staging","master"]'), github.ref_name)
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.build.outputs.revision }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build native packages from the published source
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ github.event_name == 'pull_request' && 'preview' || github.ref_name }}
          BUILD_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm file
          python3 -m unittest discover -s tests -v
          mkdir extracted
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            series=$(python3 scripts/release/upstream_release.py pinned-series)
            python3 scripts/release/upstream_release.py prepare --series "$series" --output bundle
            TAG=$(python3 -c 'import json; print(json.load(open("bundle/manifest.json"))["tag"])')
          else
            if [[ -z "$TAG" ]]; then
              TAG=$(python3 scripts/release/channels.py pinned-tag driver/upstream.lock)
            fi
            [[ "$TAG" =~ ^rfc-[0-9]{8}\.rfc[0-9]+\.s[0-9]+$ ]]
            mkdir bundle
            gh release view "$TAG" --json isDraft --jq .isDraft | grep -qx false
            gh release download "$TAG" --pattern "quantum-${TAG#rfc-}.tar.gz" --pattern SHA256SUMS --dir bundle
          fi
          (cd bundle && sha256sum -c SHA256SUMS)
          tar -xzf "bundle/quantum-${TAG#rfc-}.tar.gz" -C extracted
          docker build -t quantum-acp-build tests/fixtures/acp
          mkdir acp-build
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace:ro" -v "$PWD/acp-build:/output" \
            quantum-acp-build python3 /workspace/scripts/release/build_acp.py /output/runtime
          base_revision=$(cat packaging/native/revision)
          revision=$(python3 scripts/release/channels.py revision "$RELEASE_BRANCH" "$base_revision" "$BUILD_ID")
          upgrade_revision=$(python3 scripts/release/channels.py revision "$RELEASE_BRANCH" "$((base_revision + 1))" "$BUILD_ID")
          python3 scripts/release/build_native.py "extracted/quantum-${TAG#rfc-}" native --acp acp-build/runtime --revision "$revision"
          python3 scripts/release/build_native.py "extracted/quantum-${TAG#rfc-}" upgrade --acp acp-build/runtime --revision "$upgrade_revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: native-input
          path: |
            bundle/
            native/
            upgrade/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-22.04
            family: ubuntu
            image: ubuntu:22.04
          - id: ubuntu-24.04
            family: ubuntu
            image: ubuntu:24.04
          - id: debian-12
            family: debian
            image: debian:12
          - id: debian-13
            family: debian
            image: debian:13
          - id: fedora
            family: fedora
            image: fedora:43
          - id: opensuse
            family: opensuse
            image: opensuse/tumbleweed:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-input
          path: native-input
      - name: Test installation, upgrade and removal without hardware
        env:
          FAMILY: ${{ matrix.family }}
          IMAGE: ${{ matrix.image }}
          TEST_ID: ${{ matrix.id }}
        run: |
          mkdir evidence
          docker pull "$IMAGE"
          mkdir -p "evidence/$TEST_ID"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > "evidence/$TEST_ID/image.json"
          docker run --rm --cap-drop=ALL --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=FOWNER --cap-add=SETUID --cap-add=SETGID \
            -v "$PWD:/workspace:ro" -v "$PWD/evidence:/evidence" \
            "$IMAGE" bash /workspace/scripts/release/test-distro.sh "$FAMILY" \
            /workspace/native-input/bundle "/evidence/$TEST_ID" /workspace/native-input/native /workspace/native-input/upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.id }}
          path: evidence/

  release-check:
    needs: [build, test, apt-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every package and APT gate
        env:
          BUILD: ${{ needs.build.result }}
          NATIVE: ${{ needs.test.result }}
          APT: ${{ needs.apt-test.result }}
        run: |
          [[ "$BUILD" == success && "$NATIVE" == success && "$APT" == success ]]

  publish:
    needs: [build, test, apt-test]
    if: >-
      (github.ref == 'refs/heads/staging' &&
       (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
      (github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require staging ancestry for a master release
        if: github.ref == 'refs/heads/master'
        run: |
          git merge-base --is-ancestor origin/staging HEAD
      - uses: actions/download-artifact@v4
        with:
          name: native-input
          path: native-input
      - uses: actions/download-artifact@v4
        with:
          pattern: native-evidence-*
          path: evidence
          merge-multiple: true
      - name: Attach tested packages without replacing existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          set -euo pipefail
          cd native-input/native
          sha256sum -c "native-$REVISION-SHA256SUMS"
          # Retrying a partial upload may only reuse byte-identical package assets.
          for asset in ./*; do
            name=${asset#./}
            # GitHub replaces tildes in asset names. Use its transport spelling
            # explicitly so immutable retries can find and compare existing bytes.
            name=$(printf '%s' "$name" | tr '~' '.')
            mkdir -p /tmp/existing-native /tmp/native-upload
            if [[ "$name" == *-SHA256SUMS ]]; then
              sed 's/~staging\./.staging./g' "$asset" > "/tmp/native-upload/$name"
            else
              cp "$asset" "/tmp/native-upload/$name"
            fi
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download "$TAG" --pattern "$name" --dir /tmp/existing-native
              cmp "/tmp/native-upload/$name" "/tmp/existing-native/$name"
            else
              gh release upload "$TAG" "/tmp/native-upload/$name"
            fi
          done
          cd ../..
          asset_revision=$(printf '%s' "$REVISION" | tr '~' '.')
          evidence="native-$asset_revision-build-evidence.tar.gz"
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$evidence"; then
            tar -czf "$evidence" evidence
            gh release upload "$TAG" "$evidence"
          fi

  apt-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-22.04
            image: ubuntu:22.04
          - id: ubuntu-24.04
            image: ubuntu:24.04
          - id: debian-12
            image: debian:12
          - id: debian-13
            image: debian:13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-input
          path: native-input
      - name: Verify signed APT consumption and tamper rejection
        env:
          IMAGE: ${{ matrix.image }}
          TEST_ID: ${{ matrix.id }}
        run: |
          mkdir evidence
          set -o pipefail
          docker run --rm -v "$PWD:/workspace:ro" "$IMAGE" \
            bash /workspace/scripts/release/test-apt.sh /workspace/native-input/native \
            /workspace/native-input/upgrade 2>&1 | tee "evidence/apt-$TEST_ID.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-apt-${{ matrix.id }}
          path: evidence/
