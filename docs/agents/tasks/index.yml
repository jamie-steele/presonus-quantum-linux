schema_version: 1
area: tasks
description: Open Quantum2626 tasks and routing to indexed task history.

task_system:
  guide: docs/agents/tasks/README.md
  template: docs/agents/tasks/task-template.md

# Legacy implementation and migration work is completed or superseded by upstream.
# Known limitations remain in notes/CURRENT_STATUS.md; they are not automatic tasks.
tasks: []

archives:
  - id: closed-tasks
    title: Closed task history
    path: docs/agents/tasks/closed/index.yml
    summary: Completed research and integration evidence plus legacy feature and experiment plans superseded by upstream.
    status: historical
    load_when:
      - looking up a closed task ID or prior implementation and validation evidence
      - checking earlier decisions before starting overlapping work
      - assigning the next task ID across open and closed tasks

maintenance:
  - Search this index and the closed archive index before creating overlapping work or assigning an ID.
  - Start a focused task as one Markdown file under docs/agents/tasks/.
  - Migrate a task to a same-named folder with its own index.yml only when it needs branches.
  - A top-level task entry path may point to either the single Markdown record or the nested index.
  - Move closed records and their task entries into docs/agents/tasks/closed/ and its index.yml.
  - Keep each task indexed exactly once; update references when moving or reopening a record.
  - Preserve closed evidence and task IDs; never silently reuse an ID.
  - Check the pinned upstream implementation before opening a feature task; do not duplicate upstream functionality.
  - Create validation or integration tasks for concrete current objectives, not every untested feature or retired experiment.
