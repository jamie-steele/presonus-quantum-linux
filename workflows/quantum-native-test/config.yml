name: quantum-native-test
description: Verify DEB install, upgrade, migration and removal in Ubuntu and Debian containers.
vars:
  QUANTUM_NATIVE_BUNDLE: ''
  QUANTUM_NATIVE_PACKAGES: ''
  QUANTUM_NATIVE_UPGRADE: ''
  QUANTUM_NATIVE_EVIDENCE: ''
  QUANTUM_NATIVE_IMAGES: 'ubuntu:22.04 ubuntu:24.04 debian:12 debian:13'
steps:
  - id: tooling-tests
    kind: host
    cmd: python3 -m unittest discover -s tests -v
  - id: deb-lifecycle
    kind: host
    run: scripts/release/test-native-matrix.sh
