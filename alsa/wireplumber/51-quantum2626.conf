# WirePlumber 0.5+ equivalent of the 0.4 Lua policy.
monitor.alsa.rules = [
  {
    matches = [ { device.vendor.id = "0x1c67" device.product.id = "0x0104" } ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = true
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.*\\.HiFi__quantum2626_stereo_out_.*" } ]
    actions = {
      update-props = {
        api.alsa.period-size = 128
        api.alsa.period-num = 4
        api.alsa.headroom = 256
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.*\\.HiFi__quantum2626_mono_in_.*" } ]
    actions = {
      update-props = {
        api.alsa.period-size = 128
        api.alsa.period-num = 4
      }
    }
  }
]
